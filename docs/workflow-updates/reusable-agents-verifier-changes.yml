# Evaluate mode: insert after the "Setup Python for LLM evaluation" step.
- name: Cache pip (LLM evaluation requirements)
  if: steps.context.outputs.should_run == 'true' && inputs.mode == 'evaluate'
  uses: actions/cache@v4
  with:
    path: |
      ~/.cache/pip
    key: >-
      pip-${{ runner.os }}-${{ steps.setup-python-evaluate.outputs.python-version }}-${{ hashFiles('.workflows-lib/tools/requirements-llm.txt') }}
    restore-keys: |
      pip-${{ runner.os }}-${{ steps.setup-python-evaluate.outputs.python-version }}-
      pip-${{ runner.os }}-

# Evaluate mode: replace the existing "Install LLM evaluation dependencies" step.
- name: Install LLM evaluation dependencies
  if: steps.context.outputs.should_run == 'true' && inputs.mode == 'evaluate'
  run: |
    python -m pip install --upgrade pip
    pip install -r .workflows-lib/tools/requirements-llm.txt

# Compare mode: insert after the "Setup Python for comparison" step.
- name: Cache pip (LLM comparison requirements)
  if: steps.context.outputs.should_run == 'true' && inputs.mode == 'compare'
  uses: actions/cache@v4
  with:
    path: |
      ~/.cache/pip
    key: >-
      pip-${{ runner.os }}-${{ steps.setup-python-compare.outputs.python-version }}-${{ hashFiles('.workflows-lib/tools/requirements-llm.txt') }}
    restore-keys: |
      pip-${{ runner.os }}-${{ steps.setup-python-compare.outputs.python-version }}-
      pip-${{ runner.os }}-

# Compare mode: replace the existing "Install comparison dependencies" step.
- name: Install comparison dependencies
  if: steps.context.outputs.should_run == 'true' && inputs.mode == 'compare'
  run: |
    python -m pip install --upgrade pip
    pip install -r .workflows-lib/tools/requirements-llm.txt
