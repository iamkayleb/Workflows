name: Capability Check

# Pre-flight check before agent assignment to identify blockers
# Uses capability_check.py to detect issues agents cannot complete
#
# SUPPORTED AGENTS: agent:codex, agent:claude, and any future agent:* labels
# DYNAMIC: Triggers on ANY agent label from registry.yml or with agent: prefix
# No need to modify this workflow when adding new agents.

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write
  models: read

concurrency:
  group: agents-capability-check-${{ github.repository }}-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  # First job: Check if the label is an agent label from registry
  check-agent-label:
    runs-on: ubuntu-latest
    outputs:
      is_agent_label: ${{ steps.check.outputs.is_agent_label }}
      agent_id: ${{ steps.check.outputs.agent_id }}
      agent_name: ${{ steps.check.outputs.agent_name }}
      agent_label: ${{ steps.check.outputs.agent_label }}
    steps:
      - name: Checkout for registry
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/agents/registry.yml
            .github/scripts/agent-router.js
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install js-yaml

      - name: Check if label is an agent label
        id: check
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const yaml = require('js-yaml');

            const labelName = context.payload.label?.name || '';
            console.log(`Label added: ${labelName}`);

            // Load registry
            let registry;
            try {
              const content = fs.readFileSync('.github/agents/registry.yml', 'utf8');
              registry = yaml.load(content);
            } catch (error) {
              console.log(`Could not load registry: ${error.message}`);
              // Fallback: check for known agent: prefix
              if (labelName.startsWith('agent:')) {
                core.setOutput('is_agent_label', 'true');
                core.setOutput('agent_id', labelName.replace('agent:', ''));
                core.setOutput('agent_name', labelName.replace('agent:', ''));
                core.setOutput('agent_label', labelName);
                return;
              }
              core.setOutput('is_agent_label', 'false');
              return;
            }

            // Check if label matches any agent in registry
            for (const [agentId, config] of Object.entries(registry.agents || {})) {
              if (config.label === labelName) {
                console.log(`Matched agent: ${agentId} (${config.name})`);
                core.setOutput('is_agent_label', 'true');
                core.setOutput('agent_id', agentId);
                core.setOutput('agent_name', config.name || agentId);
                core.setOutput('agent_label', labelName);
                return;
              }
            }

            // Also support generic agent: prefix for future agents
            if (labelName.startsWith('agent:')) {
              const agentId = labelName.replace('agent:', '');
              console.log(`Unknown agent label, but has agent: prefix: ${agentId}`);
              core.setOutput('is_agent_label', 'true');
              core.setOutput('agent_id', agentId);
              core.setOutput('agent_name', agentId);
              core.setOutput('agent_label', labelName);
              return;
            }

            console.log('Not an agent label');
            core.setOutput('is_agent_label', 'false');

  capability-check:
    needs: check-agent-label
    runs-on: ubuntu-latest
    # Only run if an agent label was added
    if: needs.check-agent-label.outputs.is_agent_label == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/scripts/github-api-with-retry.js
            .github/agents/registry.yml
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[langchain]" --quiet

      - name: Extract issue content
        id: extract
        uses: actions/github-script@v8
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';

            // Extract Tasks section
            const tasksMatch = body.match(/## Tasks\s*\n([\s\S]*?)(?=##|$)/i);
            const tasks = tasksMatch ? tasksMatch[1].trim() : '';

            // Extract Acceptance Criteria section
            const acceptanceMatch = body.match(/## Acceptance [Cc]riteria\s*\n([\s\S]*?)(?=##|$)/i);
            const acceptance = acceptanceMatch ? acceptanceMatch[1].trim() : '';

            // Write to files for Python script
            const fs = require('fs');
            fs.writeFileSync('tasks.md', tasks || 'No tasks defined');
            fs.writeFileSync('acceptance.md', acceptance || 'No acceptance criteria defined');

            core.setOutput('has_tasks', tasks ? 'true' : 'false');
            core.setOutput('has_acceptance', acceptance ? 'true' : 'false');

      - name: Run capability check
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "
          import json
          import os
          import sys
          sys.path.insert(0, '.')

          from scripts.langchain.capability_check import check_capability

          # Read extracted content
          tasks = open('tasks.md').read()
          acceptance = open('acceptance.md').read()

          # Run capability check
          result = check_capability(tasks, acceptance)

          if result is None:
              print('::warning::Could not run capability check (LLM unavailable)')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('check_failed=true\n')
              sys.exit(0)

          # Output results
          result_dict = result.to_dict()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('check_failed=false\n')
              f.write(f'recommendation={result.recommendation}\n')
              f.write(f'blocked_count={len(result.blocked_tasks)}\n')
              f.write(f'partial_count={len(result.partial_tasks)}\n')
              f.write(f'result_json={json.dumps(result_dict)}\n')

          print(f'Recommendation: {result.recommendation}')
          print(f'Blocked tasks: {len(result.blocked_tasks)}')
          print(f'Partial tasks: {len(result.partial_tasks)}')
          print(f'Actionable tasks: {len(result.actionable_tasks)}')
          "

      - name: Add needs-human label if blocked
        if: steps.check.outputs.recommendation == 'BLOCKED'
        uses: actions/github-script@v8
        env:
          AGENT_LABEL: ${{ needs.check-agent-label.outputs.agent_label }}
          AGENT_NAME: ${{ needs.check-agent-label.outputs.agent_name }}
        with:
          script: |
            const fs = require('fs');
            const retryHelperPath = './.github/scripts/github-api-with-retry.js';
            const retryHelpers = fs.existsSync(retryHelperPath)
              ? require(retryHelperPath)
              : {
                  withRetry: (fn) => fn(),
                  paginateWithRetry: (githubInstance, method, params) =>
                    githubInstance.paginate(method, params),
                };
            const { withRetry } = retryHelpers;

            const agentLabel = process.env.AGENT_LABEL;
            const agentName = process.env.AGENT_NAME;

            await withRetry(() => github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['needs-human']
            }));

            // Remove the agent label since agent can't complete this
            // DYNAMIC: Uses detected agent label from registry
            try {
              await withRetry(() => github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: agentLabel
              }));
              core.info(`Removed ${agentLabel} - ${agentName} cannot complete this issue`);
            } catch (e) {
              core.warning(`Could not remove ${agentLabel} label: ${e.message}`);
            }

      - name: Post capability report
        if: steps.check.outputs.check_failed != 'true'
        uses: actions/github-script@v8
        env:
          RESULT_JSON: ${{ steps.check.outputs.result_json }}
          RECOMMENDATION: ${{ steps.check.outputs.recommendation }}
          AGENT_ID: ${{ needs.check-agent-label.outputs.agent_id }}
          AGENT_NAME: ${{ needs.check-agent-label.outputs.agent_name }}
          AGENT_LABEL: ${{ needs.check-agent-label.outputs.agent_label }}
        with:
          script: |
            const fs = require('fs');
            const retryHelperPath = './.github/scripts/github-api-with-retry.js';
            const retryHelpers = fs.existsSync(retryHelperPath)
              ? require(retryHelperPath)
              : {
                  withRetry: (fn) => fn(),
                  paginateWithRetry: (githubInstance, method, params) =>
                    githubInstance.paginate(method, params),
                };
            const { withRetry } = retryHelpers;

            const result = JSON.parse(process.env.RESULT_JSON || '{}');
            const recommendation = process.env.RECOMMENDATION || 'UNKNOWN';
            const agentName = process.env.AGENT_NAME || 'Agent';
            const agentLabel = process.env.AGENT_LABEL || 'agent:unknown';

            let emoji = '✅';
            let status = `${agentName} can proceed`;
            if (recommendation === 'BLOCKED') {
              emoji = '🚫';
              status = `${agentName} cannot complete this issue`;
            } else if (recommendation === 'REVIEW_NEEDED') {
              emoji = '⚠️';
              status = 'Some tasks may need human assistance';
            }

            let body = `### ${emoji} Capability Check: ${status}\n\n`;
            body += `**Agent:** ${agentName} (\`${agentLabel}\`)\n`;
            body += `**Recommendation:** ${recommendation}\n\n`;

            if (result.actionable_tasks && result.actionable_tasks.length > 0) {
              body += `**✅ Actionable Tasks (${result.actionable_tasks.length}):**\n`;
              result.actionable_tasks.forEach(t => { body += `- ${t}\n`; });
              body += '\n';
            }

            if (result.partial_tasks && result.partial_tasks.length > 0) {
              body += `**⚠️ Partial Tasks (${result.partial_tasks.length}):**\n`;
              result.partial_tasks.forEach(t => {
                body += `- ${t.task}\n  - *Limitation:* ${t.limitation}\n`;
              });
              body += '\n';
            }

            if (result.blocked_tasks && result.blocked_tasks.length > 0) {
              body += `**🚫 Blocked Tasks (${result.blocked_tasks.length}):**\n`;
              result.blocked_tasks.forEach(t => {
                body += `- ${t.task}\n  - *Reason:* ${t.reason}\n`;
                if (t.suggested_action) {
                  body += `  - *Suggested Action:* ${t.suggested_action}\n`;
                }
              });
              body += '\n';
            }

            if (result.human_actions_needed && result.human_actions_needed.length > 0) {
              body += `**👤 Human Actions Needed:**\n`;
              result.human_actions_needed.forEach(a => { body += `- ${a}\n`; });
              body += '\n';
            }

            body += `---\n*Auto-generated by capability check*`;

            // Check for existing comment
            const { data: comments } = await withRetry(() => github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 50
            }));

            const existingComment = comments.find(c =>
              c.body.includes('### ✅ Capability Check') ||
              c.body.includes('### ⚠️ Capability Check') ||
              c.body.includes('### 🚫 Capability Check')
            );

            if (existingComment) {
              await withRetry(() => github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              }));
            } else {
              await withRetry(() => github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              }));
            }
