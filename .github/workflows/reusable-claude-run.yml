name: Reusable Claude Run

on:
  workflow_call:
    inputs:
      skip:
        description: 'If true, skip execution entirely. Used for conditional calls.'
        required: false
        default: false
        type: boolean
      prompt_file:
        description: 'Path to the prompt file that Claude should read.'
        required: true
        type: string
      mode:
        description: 'Claude mode for logging purposes (keepalive | autofix | verifier).'
        required: false
        default: keepalive
        type: string
      pr_number:
        description: 'Optional pull request number (used for logging or comments by callers).'
        required: false
        default: ''
        type: string
      pr_ref:
        description: 'The branch/ref to checkout and push to (e.g., refs/heads/feature-branch).'
        required: false
        default: ''
        type: string
      workflows_ref:
        description: 'The ref of the Workflows repo to checkout for scripts. Defaults to main.'
        required: false
        default: 'main'
        type: string
      max_runtime_minutes:
        description: 'Upper bound for the job runtime in minutes.'
        required: false
        default: 45
        type: number
      appendix:
        description: 'Optional context appended to the prompt passed to Claude.'
        required: false
        default: ''
        type: string
      iteration:
        description: 'Current iteration number (for tracking in completion comments).'
        required: false
        default: ''
        type: string
      environment:
        description: 'GitHub environment to run in (agent-standard or agent-high-privilege).'
        required: false
        default: 'agent-standard'
        type: string
      bedrock_region:
        description: 'AWS region for Bedrock (default: us-east-1).'
        required: false
        default: 'us-east-1'
        type: string
      bedrock_model_id:
        description: 'Bedrock model ID (default: anthropic.claude-sonnet-4-20250514-v1:0).'
        required: false
        default: 'anthropic.claude-sonnet-4-20250514-v1:0'
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        description: 'AWS access key ID for Bedrock'
        required: true
      AWS_SECRET_ACCESS_KEY:
        description: 'AWS secret access key for Bedrock'
        required: true
      AWS_SESSION_TOKEN:
        description: 'AWS session token (optional, for assumed roles)'
        required: false
      WORKFLOWS_APP_ID:
        required: false
      WORKFLOWS_APP_PRIVATE_KEY:
        required: false
    outputs:
      final-message:
        description: 'Full Claude output message (base64 encoded)'
        value: ${{ jobs.claude.outputs.final-message }}
      final-message-summary:
        description: 'First 500 chars of Claude output (safe for PR comments)'
        value: ${{ jobs.claude.outputs.final-message-summary }}
      exit-code:
        description: 'Claude run exit code (0=success)'
        value: ${{ jobs.claude.outputs.exit-code }}
      changes-made:
        description: 'Whether Claude made file changes (true/false)'
        value: ${{ jobs.claude.outputs.changes-made }}
      commit-sha:
        description: 'SHA of the commit if changes were pushed'
        value: ${{ jobs.claude.outputs.commit-sha }}
      files-changed:
        description: 'Number of files changed by Claude'
        value: ${{ jobs.claude.outputs.files-changed }}
      error-category:
        description: 'Error category if failure occurred (transient/auth/resource/logic/unknown)'
        value: ${{ jobs.claude.outputs.error-category }}
      error-type:
        description: 'Error type if failure occurred (claude/infrastructure/auth/unknown)'
        value: ${{ jobs.claude.outputs.error-type }}
      error-recovery:
        description: 'Suggested recovery action if failure occurred'
        value: ${{ jobs.claude.outputs.error-recovery }}

permissions:
  contents: write
  pull-requests: write
  actions: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claude:
    name: Claude (${{ inputs.mode }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: ${{ inputs.max_runtime_minutes }}
    if: ${{ !inputs.skip }}
    outputs:
      final-message: ${{ steps.run_claude.outputs.final-message }}
      final-message-summary: ${{ steps.run_claude.outputs.final-message-summary }}
      exit-code: ${{ steps.run_claude.outputs.exit-code }}
      changes-made: ${{ steps.commit.outputs.changes-made }}
      commit-sha: ${{ steps.commit.outputs.commit-sha }}
      files-changed: ${{ steps.commit.outputs.files-changed }}
      error-category: ${{ steps.classify_failure.outputs.error_category }}
      error-type: ${{ steps.classify_failure.outputs.error_type }}
      error-recovery: ${{ steps.classify_failure.outputs.error_recovery }}
    steps:
      - name: Mint GitHub App token (preferred)
        id: app_token
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.WORKFLOWS_APP_ID }}
          private-key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}

      - name: Select auth token
        id: auth_token
        env:
          APP_TOKEN: ${{ steps.app_token.outputs.token || '' }}
        run: |
          set -euo pipefail
          checkout_token="${APP_TOKEN:-${GITHUB_TOKEN}}"
          push_token="${APP_TOKEN:-}"
          source="app-token"
          push_allowed="true"

          if [ -z "$push_token" ]; then
            source="github-token"
            push_allowed="false"
          fi

          {
            echo "checkout_token=${checkout_token}"
            echo "push_token=${push_token}"
            echo "source=${source}"
            echo "push_allowed=${push_allowed}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "WORKFLOWS_TOKEN=${checkout_token}"
            echo "CLAUDE_MODE=${{ inputs.mode }}"
            echo "CLAUDE_PR_NUMBER=${{ inputs.pr_number }}"
          } >> "$GITHUB_ENV"

          printf 'Checkout auth: %s; push permitted with app token: %s.\n' "$source" "$push_allowed"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.pr_ref || github.ref }}
          token: ${{ steps.auth_token.outputs.checkout_token }}

      - name: Checkout Workflows scripts
        uses: actions/checkout@v6
        with:
          repository: stranske/Workflows
          ref: ${{ inputs.workflows_ref }}
          path: .workflows-lib
          token: ${{ steps.auth_token.outputs.checkout_token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip

          # Install repo dependencies if present
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          fi

          if [ -f pyproject.toml ]; then
            python -m pip install -e ".[dev]" || python -m pip install -e . || true
          fi

          # Install boto3 for Bedrock API
          python -m pip install boto3

      - name: Configure AWS credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ inputs.bedrock_region }}
        run: |
          set -euo pipefail
          mkdir -p ~/.aws

          # Create credentials file
          cat > ~/.aws/credentials << EOF
          [default]
          aws_access_key_id = ${AWS_ACCESS_KEY_ID}
          aws_secret_access_key = ${AWS_SECRET_ACCESS_KEY}
          EOF

          if [ -n "${AWS_SESSION_TOKEN:-}" ]; then
            echo "aws_session_token = ${AWS_SESSION_TOKEN}" >> ~/.aws/credentials
          fi

          # Create config file
          cat > ~/.aws/config << EOF
          [default]
          region = ${AWS_REGION}
          EOF

          chmod 600 ~/.aws/credentials ~/.aws/config
          echo "✅ AWS credentials configured for region ${AWS_REGION}"

          # Verify credentials work
          aws sts get-caller-identity || {
            echo "::error::AWS credentials validation failed"
            exit 1
          }

      - name: Install Claude Code CLI
        run: |
          set -euo pipefail
          echo "Installing Claude Code CLI..."
          npm install -g @anthropic-ai/claude-code
          claude --version || echo "Claude CLI installed"

      - name: Assemble prompt
        id: prompt
        env:
          BASE_PROMPT: ${{ inputs.prompt_file }}
          APPENDIX: ${{ inputs.appendix }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          base="${BASE_PROMPT}"

          # Use PR-specific filename to avoid merge conflicts
          if [ -n "${PR_NUMBER}" ]; then
            output="claude-prompt-${PR_NUMBER}.md"
          else
            output="claude-prompt.md"
          fi

          if [ -z "$base" ] || [ ! -f "$base" ]; then
            echo "::error::Base prompt file not found: ${base}"
            exit 1
          fi

          # Start with agent instructions if available
          if [ -f ".github/codex/AGENT_INSTRUCTIONS.md" ]; then
            {
              cat ".github/codex/AGENT_INSTRUCTIONS.md"
              echo
              echo "---"
              echo
              echo "## Task Prompt"
              echo
            } > "$output"
            cat "$base" >> "$output"
          else
            cat "$base" > "$output"
          fi

          if [ -n "$APPENDIX" ]; then
            {
              echo
              echo "## Run context"
              printf '%s\n' "$APPENDIX"
            } >> "$output"
          fi

          echo "file=${output}" >> "$GITHUB_OUTPUT"
          echo "Prompt assembled: ${output}"

      - name: Clean workspace for Claude
        id: clean_workspace
        run: |
          set -euo pipefail
          echo "Cleaning workspace to ensure clean git state for Claude..."

          # Handle .workflows-lib directory
          if [ -d ".workflows-lib" ]; then
            if ! grep -q "^\.workflows-lib" .git/info/exclude 2>/dev/null; then
              echo ".workflows-lib" >> .git/info/exclude 2>/dev/null || true
            fi
          fi

          # Remove old session/output files
          rm -f claude-session*.jsonl claude-output*.md claude-analysis*.json 2>/dev/null || true

          echo "Git status after cleanup:"
          git status --short || true

      - name: Run Claude
        id: run_claude
        env:
          AWS_REGION: ${{ inputs.bedrock_region }}
          BEDROCK_MODEL_ID: ${{ inputs.bedrock_model_id }}
          CLAUDE_CODE_USE_BEDROCK: '1'
          ANTHROPIC_MODEL: ${{ inputs.bedrock_model_id }}
        run: |
          set -euo pipefail

          PROMPT_FILE="${{ steps.prompt.outputs.file }}"
          PR_NUM="${{ inputs.pr_number }}"

          if [ -n "${PR_NUM}" ]; then
            OUTPUT_FILE="claude-output-${PR_NUM}.md"
            SESSION_FILE="claude-session-${PR_NUM}.jsonl"
          else
            OUTPUT_FILE="claude-output.md"
            SESSION_FILE="claude-session.jsonl"
          fi

          echo "Running Claude Code with Bedrock backend..."
          echo "Prompt file: $PROMPT_FILE"
          echo "Model: $BEDROCK_MODEL_ID"
          echo "Region: $AWS_REGION"

          PROMPT_CONTENT=$(cat "$PROMPT_FILE")

          # Try Claude Code CLI first
          CLAUDE_EXIT=0
          if command -v claude &> /dev/null; then
            echo "Using Claude Code CLI..."
            # Configure Claude to use Bedrock
            claude config set --global provider bedrock 2>/dev/null || true
            claude config set --global model "$BEDROCK_MODEL_ID" 2>/dev/null || true

            # Run Claude in non-interactive mode
            claude --print "$PROMPT_CONTENT" > "$OUTPUT_FILE" 2>&1 || CLAUDE_EXIT=$?
          else
            echo "Claude CLI not available, using direct Bedrock API..."
            # Fallback to direct Bedrock API call via Python
            python3 << PYEOF
import boto3
import json
import os
import sys

bedrock = boto3.client(
    service_name='bedrock-runtime',
    region_name=os.environ.get('AWS_REGION', 'us-east-1')
)

model_id = os.environ.get('BEDROCK_MODEL_ID', 'anthropic.claude-sonnet-4-20250514-v1:0')
prompt_file = "${PROMPT_FILE}"
output_file = "${OUTPUT_FILE}"

with open(prompt_file, 'r') as f:
    prompt_content = f.read()

# Prepare the request for Claude on Bedrock
body = json.dumps({
    "anthropic_version": "bedrock-2023-05-31",
    "max_tokens": 4096,
    "messages": [
        {
            "role": "user",
            "content": prompt_content
        }
    ]
})

try:
    response = bedrock.invoke_model(
        modelId=model_id,
        body=body,
        contentType='application/json',
        accept='application/json'
    )

    response_body = json.loads(response['body'].read())
    output_text = response_body.get('content', [{}])[0].get('text', '')

    with open(output_file, 'w') as f:
        f.write(output_text)

    print(f"Claude response written to {output_file}")
    sys.exit(0)

except Exception as e:
    print(f"::error::Bedrock API call failed: {e}")
    with open(output_file, 'w') as f:
        f.write(f"Error: {str(e)}")
    sys.exit(1)
PYEOF
            CLAUDE_EXIT=$?
          fi

          echo "exit-code=${CLAUDE_EXIT}" >> "$GITHUB_OUTPUT"

          if [ "$CLAUDE_EXIT" -ne 0 ]; then
            echo "::error::Claude run exited with code ${CLAUDE_EXIT}"
          fi

          echo "Claude completed with exit code ${CLAUDE_EXIT}."

          # Set outputs
          if [ -f "$OUTPUT_FILE" ]; then
            encoded=$(base64 -w 0 "$OUTPUT_FILE")
            echo "final-message=${encoded}" >> "$GITHUB_OUTPUT"

            summary=$(head -c 500 "$OUTPUT_FILE" | tr '\n' ' ' | sed 's/"/\\"/g')
            echo "final-message-summary=${summary}" >> "$GITHUB_OUTPUT"
          else
            echo "final-message=" >> "$GITHUB_OUTPUT"
            echo "final-message-summary=No output captured" >> "$GITHUB_OUTPUT"
          fi

          exit "$CLAUDE_EXIT"

      - name: Commit and push changes
        id: commit
        env:
          MODE: ${{ inputs.mode }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_REF: ${{ inputs.pr_ref }}
          PUSH_ALLOWED: ${{ steps.auth_token.outputs.push_allowed }}
          PUSH_TOKEN: ${{ steps.auth_token.outputs.push_token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TARGET_REF="${PR_REF:-${{ github.ref_name }}}"
          TARGET_BRANCH="${TARGET_REF#refs/heads/}"
          echo "Target branch: ${TARGET_BRANCH}"

          CHANGED_FILES=$(git status --porcelain | wc -l)
          echo "files-changed=${CHANGED_FILES}" >> "$GITHUB_OUTPUT"

          if [ "$CHANGED_FILES" -eq 0 ]; then
            echo "No changes to commit."
            echo "changes-made=false" >> "$GITHUB_OUTPUT"
            echo "commit-sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Exclude prompt/output files
          git checkout -- claude-output*.md claude-prompt*.md 2>/dev/null || true

          CHANGED_FILES=$(git status --porcelain | wc -l)
          echo "files-changed=${CHANGED_FILES}" >> "$GITHUB_OUTPUT"

          if [ "$CHANGED_FILES" -eq 0 ]; then
            echo "No changes to commit after excluding artifacts."
            echo "changes-made=false" >> "$GITHUB_OUTPUT"
            echo "commit-sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changes-made=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Claude made changes to ${CHANGED_FILES} file(s)"

          commit_message="chore(claude-${MODE}): apply updates"
          if [ -n "$PR_NUMBER" ]; then
            commit_message="${commit_message} (PR #${PR_NUMBER})"
          fi

          if [ "$PUSH_ALLOWED" != "true" ]; then
            echo "::error::GitHub App token missing; refusing to push."
            echo "commit-sha=" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          REMOTE_URL="https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}"

          git add -A
          # Exclude generated artifacts
          git reset HEAD -- claude-output*.md claude-prompt*.md claude-session-*.jsonl \
            .coverage .workflows-lib coverage.xml 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No non-artifact changes to commit."
            echo "changes-made=false" >> "$GITHUB_OUTPUT"
            echo "commit-sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::group::Changes being committed"
          git diff --cached --stat
          echo "::endgroup::"

          git commit -m "$commit_message" || { echo "::error::git commit failed"; exit 1; }

          COMMIT_SHA=$(git rev-parse HEAD)
          echo "commit-sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"

          # Sync with remote before push
          echo "::group::Sync with remote before push"
          git fetch "${REMOTE_URL}" "${TARGET_BRANCH}" 2>/dev/null || true
          if git rev-parse "FETCH_HEAD" >/dev/null 2>&1; then
            if ! git rebase FETCH_HEAD; then
              echo "::warning::Rebase failed, attempting merge"
              git rebase --abort 2>/dev/null || true
              git pull --no-rebase "${REMOTE_URL}" "${TARGET_BRANCH}" --allow-unrelated-histories || true
            fi
            COMMIT_SHA=$(git rev-parse HEAD)
            echo "commit-sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          fi
          echo "::endgroup::"

          git push "${REMOTE_URL}" "HEAD:${TARGET_BRANCH}"
          echo "::notice::Pushed commit ${COMMIT_SHA} with ${CHANGED_FILES} file(s) changed"

      - name: Upload Claude output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: claude-output-${{ inputs.pr_number || github.run_id }}
          path: |
            claude-output*.md
            claude-session*.jsonl
          if-no-files-found: ignore

      - name: Classify failure type
        id: classify_failure
        if: always() && steps.run_claude.outputs.exit-code != '0'
        env:
          EXIT_CODE: ${{ steps.run_claude.outputs.exit-code }}
          OUTPUT_SUMMARY: ${{ steps.run_claude.outputs.final-message-summary }}
        run: |
          set -euo pipefail

          error_category="unknown"
          error_type="unknown"
          error_recovery="Check logs for details."

          # Classify based on output content
          if echo "$OUTPUT_SUMMARY" | grep -qi "rate limit\|throttl"; then
            error_category="transient"
            error_type="infrastructure"
            error_recovery="Rate limited. Wait and retry."
          elif echo "$OUTPUT_SUMMARY" | grep -qi "credential\|unauthorized\|forbidden\|AccessDenied"; then
            error_category="auth"
            error_type="auth"
            error_recovery="Check AWS credentials and Bedrock permissions."
          elif echo "$OUTPUT_SUMMARY" | grep -qi "timeout\|timed out"; then
            error_category="transient"
            error_type="infrastructure"
            error_recovery="Request timed out. Retry or increase timeout."
          elif echo "$OUTPUT_SUMMARY" | grep -qi "model.*not found\|ResourceNotFoundException"; then
            error_category="resource"
            error_type="infrastructure"
            error_recovery="Check Bedrock model ID and region configuration."
          fi

          {
            echo "error_category=${error_category}"
            echo "error_type=${error_type}"
            echo "error_recovery=${error_recovery}"
            echo "is_transient=$( [ "$error_category" = "transient" ] && echo "true" || echo "false" )"
          } >> "$GITHUB_OUTPUT"

          echo "Error Classification:"
          echo "  Category: ${error_category}"
          echo "  Type: ${error_type}"
          echo "  Recovery: ${error_recovery}"

      - name: Write error summary
        if: always() && steps.run_claude.outputs.exit-code != '0'
        env:
          EXIT_CODE: ${{ steps.run_claude.outputs.exit-code }}
          OUTPUT_SUMMARY: ${{ steps.run_claude.outputs.final-message-summary }}
          ERROR_CATEGORY: ${{ steps.classify_failure.outputs.error_category }}
          ERROR_TYPE: ${{ steps.classify_failure.outputs.error_type }}
          ERROR_RECOVERY: ${{ steps.classify_failure.outputs.error_recovery }}
          MODE: ${{ inputs.mode }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          {
            echo "## ❌ Claude Run Failed"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Mode | ${MODE:-unknown} |"
            echo "| Exit Code | ${EXIT_CODE:-unknown} |"
            echo "| Error Category | ${ERROR_CATEGORY:-unknown} |"
            echo "| Error Type | ${ERROR_TYPE:-unknown} |"
            if [ -n "${PR_NUMBER:-}" ]; then
              echo "| PR | #${PR_NUMBER} |"
            fi
            echo ""
            echo "### 🔍 Recovery Guidance"
            echo ""
            echo "${ERROR_RECOVERY:-Check logs for more details.}"
            echo ""
            if [ -n "${OUTPUT_SUMMARY:-}" ]; then
              echo "### 📝 Output Summary"
              echo ""
              echo '```'
              echo "${OUTPUT_SUMMARY}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
