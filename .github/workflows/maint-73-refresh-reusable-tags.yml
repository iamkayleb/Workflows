name: Maint 73 Refresh Reusable Tags

# DEPRECATED: This workflow is disabled.
# Consumer repos now use @main directly instead of floating version tags.
# The v1 tag approach added complexity without providing stability benefits
# since v1 was auto-refreshed to track main HEAD anyway.
#
# Previous purpose: Keep floating tags aligned with main so consumer repos
# always run the latest reusable workflows without editing every repo.

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'DEPRECATED - Consumer repos now use @main directly'
        required: false
        type: string
  # Disabled automatic triggers
  # push:
  #   branches: [main]

permissions:
  contents: write

concurrency:
  group: refresh-reusable-tags-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh floating tags
    runs-on: ubuntu-latest
    steps:
      - name: Skip (deprecated workflow)
        run: |
          echo "Maint 73 is deprecated; reusable workflows now reference @main directly."
          echo "No actions performed."
