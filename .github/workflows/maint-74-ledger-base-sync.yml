name: Ledger Base Sync

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-ledger-base:
    name: Align .agents ledger base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Resolve default branch
        id: base
        uses: actions/github-script@v8
        with:
          script: |
            const { data } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            if (!data?.default_branch) {
              core.setFailed('Repository default branch not available');
              return;
            }
            core.setOutput('branch', data.default_branch);

      - name: Migrate ledger base entries
        run: |
          set -euo pipefail
          python scripts/ledger_migrate_base.py --default "${{ steps.base.outputs.branch }}"

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: align agent ledgers to default branch"
          title: "chore: align agent ledgers to default branch"
          body: |
            Align .agents ledger base entries to the repository default branch.
          branch: "chore/ledger-base-sync"
          delete-branch: true
          labels: "chore"
